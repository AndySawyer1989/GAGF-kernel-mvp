name: Browser Release Gate

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: >-
          Intentionally fail the upstream browser job to verify
          required-check enforcement.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    browser-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-release:
    name: Governed Browser Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend
        shell: bash

    env:
      CI: "true"
      GAGF_STORY_ID: "GRA-UI-010M"
      GAGF_EXPECTED_BROWSER_TESTS: "58"
      GAGF_EVIDENCE_RETENTION_DAYS: "30"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Simulate governed browser failure
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.simulate_failure == true
        shell: bash
        run: |
          echo "::error title=Simulated Browser Failure::Manual required-check failure simulation was requested."
          exit 1


      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify required-check contract
        run: |
          npm run test:e2e:required-check
          npm run test:e2e:verify-required-check

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run governed browser release gate
        id: governed-release
        run: npm run ci:browser-release

      - name: Generate CI triage
        if: always()
        continue-on-error: true
        run: npm run test:e2e:write-triage

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Browser Release Gate"
            echo
            echo "- Story: \`${GAGF_STORY_ID}\`"
            echo "- Expected Playwright tests: \`${GAGF_EXPECTED_BROWSER_TESTS}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo
            if [[ -f test-evidence/playwright/results/required-check-contract.md ]]; then
              cat test-evidence/playwright/results/required-check-contract.md
              echo
            fi

            if [[ -f test-evidence/playwright/results/ci-triage.md ]]; then
              cat test-evidence/playwright/results/ci-triage.md
            elif [[ -f test-evidence/playwright/results/release-summary.md ]]; then
              cat test-evidence/playwright/results/release-summary.md
            else
              echo "Browser release evidence was not generated."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: >-
            browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-evidence/playwright/html
            frontend/test-evidence/playwright/results
            frontend/test-evidence/playwright/traces
            frontend/test-evidence/playwright/bundles
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  browser-release-required:
    name: Browser Release Required
    if: always()
    needs:
      - browser-release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enforce browser release result
        shell: bash
        env:
          BROWSER_RELEASE_RESULT: >-
            ${{ needs.browser-release.result }}
        run: |
          echo "Governed Browser Evidence result: ${BROWSER_RELEASE_RESULT}"

          if [[ "${BROWSER_RELEASE_RESULT}" != "success" ]]; then
            echo "::error title=Browser Release Required::Governed Browser Evidence finished with status ${BROWSER_RELEASE_RESULT}."
            exit 1
          fi

          echo "::notice title=Browser Release Required::Governed Browser Evidence passed."

