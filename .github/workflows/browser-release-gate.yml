name: Browser Release Gate

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/browser-release-gate.yml"

  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/browser-release-gate.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    browser-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-release:
    name: Governed browser release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend
        shell: bash

    env:
      CI: "true"
      GAGF_STORY_ID: "GRA-UI-010K"
      GAGF_EXPECTED_BROWSER_TESTS: "58"
      GAGF_EVIDENCE_RETENTION_DAYS: "30"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run governed browser release gate
        run: npm run ci:browser-release

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Browser Release Gate"
            echo
            echo "- Story: \`${GAGF_STORY_ID}\`"
            echo "- Expected Playwright tests: \`${GAGF_EXPECTED_BROWSER_TESTS}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo
            if [[ -f test-evidence/playwright/results/release-summary.md ]]; then
              cat test-evidence/playwright/results/release-summary.md
            else
              echo "Release summary was not generated."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: >-
            browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-evidence/playwright/html
            frontend/test-evidence/playwright/results
            frontend/test-evidence/playwright/traces
            frontend/test-evidence/playwright/bundles
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
