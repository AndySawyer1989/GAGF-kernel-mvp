name: Browser Release Gate

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: >-
          Intentionally fail the upstream browser job to verify
          required-check enforcement.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    browser-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  browser-release:
    name: Governed Browser Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: frontend
        shell: bash

    env:
      CI: "true"
      GAGF_STORY_ID: "GRA-UI-010M"
      GAGF_EXPECTED_BROWSER_TESTS: "58"
      GAGF_EVIDENCE_RETENTION_DAYS: "30"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Simulate governed browser failure
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.simulate_failure == true
        shell: bash
        run: |
          echo "::error title=Simulated Browser Failure::Manual required-check failure simulation was requested."
          exit 1


      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start governed backend
        working-directory: .
        shell: bash
        run: |
          nohup python -m uvicorn backend.app.main:app             --host 127.0.0.1             --port 8000             > /tmp/gagf-backend.log 2>&1 &

          echo $! > /tmp/gagf-backend.pid

          for attempt in {1..60}; do
            if curl --fail --silent               http://127.0.0.1:8000/openapi.json               > /dev/null; then
              echo "::notice title=Governed Backend::FastAPI backend is ready on port 8000."
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/gagf-backend.pid)" 2>/dev/null; then
              echo "::error title=Governed Backend::FastAPI exited before becoming ready."
              cat /tmp/gagf-backend.log
              exit 1
            fi

            sleep 1
          done

          echo "::error title=Governed Backend::FastAPI did not become ready within 60 seconds."
          cat /tmp/gagf-backend.log
          exit 1

      - name: Verify required-check contract
        run: |
          npm run test:e2e:required-check
          npm run test:e2e:verify-required-check

      - name: Install Chromium system dependencies
        timeout-minutes: 10
        run: npx --no-install playwright install-deps chromium

      - name: Install Chromium browser
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2; do
            echo "Chromium install attempt ${attempt}/2"

            if timeout 5m npx --no-install playwright install chromium; then
              echo "Chromium installation completed."
              exit 0
            fi

            if [[ "${attempt}" -eq 2 ]]; then
              echo "::error title=Chromium Provisioning::Chromium installation failed after two bounded attempts."
              exit 1
            fi

            echo "::warning title=Chromium Provisioning::First Chromium installation attempt failed or timed out; retrying once."
            sleep 5
          done

      - name: Run governed browser release gate
        id: governed-release
        run: npm run ci:browser-release

      - name: Report backend log on failure
        if: failure()
        working-directory: .
        shell: bash
        run: |
          if [[ -f /tmp/gagf-backend.log ]]; then
            echo "## Governed Backend Log" >> "${GITHUB_STEP_SUMMARY}"
            echo '```text' >> "${GITHUB_STEP_SUMMARY}"
            tail -n 200 /tmp/gagf-backend.log               >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"

            echo "Last 200 backend log lines:"
            tail -n 200 /tmp/gagf-backend.log
          else
            echo "Backend log was not created."
          fi

      - name: Generate CI triage
        if: always()
        continue-on-error: true
        run: npm run test:e2e:write-triage

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Browser Release Gate"
            echo
            echo "- Story: \`${GAGF_STORY_ID}\`"
            echo "- Expected Playwright tests: \`${GAGF_EXPECTED_BROWSER_TESTS}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo
            if [[ -f test-evidence/playwright/results/required-check-contract.md ]]; then
              cat test-evidence/playwright/results/required-check-contract.md
              echo
            fi

            if [[ -f test-evidence/playwright/results/ci-triage.md ]]; then
              cat test-evidence/playwright/results/ci-triage.md
            elif [[ -f test-evidence/playwright/results/release-summary.md ]]; then
              cat test-evidence/playwright/results/release-summary.md
            else
              echo "Browser release evidence was not generated."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: >-
            browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-evidence/playwright/html
            frontend/test-evidence/playwright/results
            frontend/test-evidence/playwright/traces
            frontend/test-evidence/playwright/bundles
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

  browser-release-required:
    name: Browser Release Required
    if: always()
    needs:
      - browser-release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enforce browser release result
        shell: bash
        env:
          BROWSER_RELEASE_RESULT: >-
            ${{ needs.browser-release.result }}
        run: |
          echo "Governed Browser Evidence result: ${BROWSER_RELEASE_RESULT}"

          if [[ "${BROWSER_RELEASE_RESULT}" != "success" ]]; then
            echo "::error title=Browser Release Required::Governed Browser Evidence finished with status ${BROWSER_RELEASE_RESULT}."
            exit 1
          fi

          echo "::notice title=Browser Release Required::Governed Browser Evidence passed."

